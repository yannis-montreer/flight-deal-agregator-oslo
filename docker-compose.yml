services:
  flightdeals:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=UTC
    volumes:
      # Bind mount (pas named volume) : la DB SQLite et les logs restent inspectables/
      # sauvegardables avec des outils de fichiers ordinaires, quel que soit l'hote final
      # (VPS / Raspberry Pi / local) — pas besoin de `docker volume inspect`.
      - ./data:/data
      # Lecture seule : override le config.yaml baked-in a l'image. Permet d'ajuster les
      # seuils (deal.minimum_discount, etc.) en editant le fichier + `docker compose restart`,
      # sans rebuild.
      - ./config:/app/config:ro

  # Suivi ponctuel OSL -> Santiago (voir trip_watch/, hors produit principal). Meme image
  # que le service flightdeals (voir Dockerfile), commande differente. Log dir et fichier
  # DB separes du service principal pour ne jamais interferer avec flightdeals.db/logs.
  trip-watch-santiago:
    build: .
    restart: unless-stopped
    # `entrypoint:`, PAS `command:` — command s'ajoute a l'ENTRYPOINT du Dockerfile au lieu
    # de le remplacer (seul CMD est remplace par command). Bug reel trouve en verifiant les
    # logs au premier demarrage : le conteneur executait silencieusement "python -m
    # flightdeals python -m trip_watch", donc en pratique juste flightdeals (arguments
    # excedentaires ignores) - avec la cle et le bot Telegram du systeme PRINCIPAL. entrypoint
    # remplace correctement l'ENTRYPOINT de l'image.
    entrypoint: ["python", "-m", "trip_watch"]
    env_file:
      - .env
    environment:
      - TZ=UTC
      - FLIGHTDEALS_LOG_DIR=/data/logs-trip-watch
      - TRIP_WATCH_DB_PATH=/data/trip_watch.db
      - TRIP_WATCH_CONFIG_PATH=/app/trip_watch/config.yaml
    volumes:
      - ./data:/data
      - ./trip_watch/config.yaml:/app/trip_watch/config.yaml:ro

# Les deux conteneurs restent autonomes sans compose : `docker run -d --restart unless-stopped
# --env-file .env -v ./data:/data flightdeals` fonctionne seul (config baked-in dans l'image),
# conformement a la contrainte "pas de dependance a un orchestrateur externe" (voir plan).
# Pour trip_watch en standalone : `docker run -d --restart unless-stopped --env-file .env
# -v ./data:/data --entrypoint python flightdeals -m trip_watch`. Pas de `ports:` : purs
# workers de fond.
