<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Veilles{% endblock %}</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d8dee4;
    --accent: #0b6bcb; --accent-text: #ffffff; --ok: #1a7f37; --warn-bg: #fff8c5; --warn-text: #6b4f00;
    --err-bg: #ffebe9; --err-text: #a40e26; --bar: #e8eaed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --card: #1d2126; --text: #e6edf3; --muted: #9198a1; --border: #30363d;
      --accent: #4493f8; --accent-text: #0d1117; --ok: #3fb950; --warn-bg: #3a2f00; --warn-text: #f2cc60;
      --err-bg: #3d0f14; --err-text: #ff9492; --bar: #2d333b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  a { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 8px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .btn { display: inline-block; background: var(--accent); color: var(--accent-text); border: 0;
         border-radius: 8px; padding: 8px 16px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .msg { border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
  .msg.ok { border: 1px solid var(--ok); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); margin: 10px 0 0; }
  .msg.err { background: var(--err-bg); color: var(--err-text); }
  .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .bar > span { display: block; height: 100%; background: var(--ok); }
  .bar.over > span { background: var(--err-text); }
  .muted { color: var(--muted); font-size: .9rem; }
  code { font-size: .9em; }
  form .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .hint { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
  input[type=text], input[type=number], input[type=date], input[type=time], select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  .checks label { font-weight: 400; display: inline-flex; gap: 6px; margin-right: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
