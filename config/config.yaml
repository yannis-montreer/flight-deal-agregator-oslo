# Configuration fonctionnelle du Flight Deal Aggregator OSL.
# Aucune donnee sensible ici — les secrets vivent dans .env (voir .env.example).
# Ce fichier est relu au debut de CHAQUE run (voir flightdeals/config.py), donc les
# seuils peuvent etre ajustes sans reconstruire l'image Docker : editer + redemarrer suffit.

origin: OSL
currency: NOK

collection:
  enabled: true
  schedule: "10:30"          # HH:MM, interprete dans le fuseau ci-dessous
  timezone: "Europe/Oslo"    # nom IANA ; gere automatiquement l'heure ete/hiver (CET/CEST)

serpapi:
  monthly_budget: 200        # cible MVP (quota gratuit reel ~250/mois, marge gardee)
  min_budget_reserve: 5      # si moins de X requetes restantes ce mois -> le run du jour est skippe
  travel_durations: [1, 2, 3]  # enum SerpApi google_travel_explore: 1=weekend, 2=~1 semaine, 3=~2 semaines
  # Asie du Sud-Est (kgmid Wikidata/Freebase Q11708 -> /m/073q1, verifie par appel reel le
  # 2026-08-19 : Singapour/Bangkok/Bali/Hanoi/Phuket/KL/Ho Chi Minh/Chiang Mai/Da Nang avec
  # prix reels). Remettre a `null` pour repasser en "partout".
  arrival_area_id: "/m/073q1"
  # 1-12 = Jan-Dec (enum SerpApi), null = 6 prochains mois par defaut. NON VERIFIE : le
  # comportement une fois novembre 2026 passe (bascule auto sur nov. 2027, ou vide ?) -
  # a surveiller en decembre 2026 et ajuster si besoin.
  month: 11

deal:
  minimum_discount: 0.30           # discount = 1 - prix_actuel / mediane_historique
  minimum_observations: 7          # sous ce seuil -> jamais de notification (evite les faux positifs)
  percentile_threshold: 0.25       # le prix actuel doit etre <= a ce percentile historique
  history_window_days: 30          # fenetre glissante d'historique consideree
  duration_tolerance_nights: 2     # tolerance +/- nuits pour considerer deux sejours "similaires"
  max_duration_deviation_ratio: 0.5  # exclut un deal si duration_minutes (vol+escales) depasse
                                      # la moyenne historique de CETTE destination de plus de 50%
                                      # (ex: moyenne 8h -> exclu au-dela de 12h). Ignore si pas
                                      # assez d'historique de duree, ou si duration_minutes absent.
  min_trip_length_nights: 6        # exclut les sejours trop courts (weekend ~2 nuits)
  max_trip_length_nights: 14       # exclut les sejours trop longs (~1 mois). Bornes inclusives.
                                    # Un vol one-way (pas de date de retour) est toujours exclu.

scoring:
  # Les poids doivent sommer a 1.0 (valide au chargement, voir config.py)
  weights: { discount: 0.45, percentile: 0.25, directness: 0.10, confidence: 0.20 }
  discount_cap: 0.60                     # au-dela, la composante discount du score sature a 1.0
  confidence_saturation_count: 30        # nombre d'observations au-dela duquel la confiance sature a 1.0
  directness_bonus: { nonstop: 1.0, one_stop: 0.5, multi_stop: 0.0, unknown: 0.5 }

dedup:
  further_drop_threshold: 0.10     # re-notifier si le prix rebaisse d'au moins 10% de plus que la derniere notif
  reappear_gap_days: 14            # re-notifier si le deal reapparait apres au moins 14 jours d'absence

notification:
  telegram: true
  send_delay_seconds: 1.0          # throttle entre deux envois Telegram consecutifs dans le meme run
  daily_summary_enabled: true      # recap quotidien systematique (deal detecte ou non) -
                                    # utile car les seuils stricts peuvent laisser des semaines
                                    # de silence sinon ; desactivable si redondant a l'usage

# Angle mort assume du MVP (spec) : tant qu'un bucket (destination/mois/duree) n'a pas
# deal.minimum_observations, AUCUN deal ne peut y etre detecte, meme si le prix est
# exceptionnel (demande utilisateur : "dans les 6 premiers jours il pourrait y avoir un deal
# qu'on rate"). Palliatif : demander a Google lui-meme (price_insights.price_level, engine
# google_flights, PAS google_travel_explore qui n'expose pas ce champ) son avis sur les
# candidats les moins chers du jour parmi ceux encore sans historique suffisant. Message
# Telegram distinct (GoogleSignalMessage), jamais confondu avec un vrai deal statistique.
# S'eteint tout seul par bucket des que deal.minimum_observations est atteint (plus jamais
# exclusion_reason="insufficient_history" pour lui) - pas de derive de cout dans la duree.
cold_start_check:
  enabled: true
  max_candidates_per_run: 3   # requetes google_flights EN PLUS des explore calls habituels
                               # (cout: jusqu'a +3/jour ≈ +90/mois tant que des buckets sont
                               # encore en cold-start ; verifie qu'il reste de la marge sous
                               # serpapi.monthly_budget avant d'augmenter ce chiffre)

logging:
  level: INFO
  max_bytes: 5242880               # 5 MB avant rotation
  backup_count: 5
