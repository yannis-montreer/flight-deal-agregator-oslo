# Configuration du suivi Santiago. Destinations Lima/La Paz : pas automatisees pour
# l'instant (backup, via scripts/search_custom_route.py en manuel si besoin).

origin: OSL
destination: SCL
destination_name: Santiago
currency: NOK

# Meme heure que l'agregateur principal (config/config.yaml: collection.schedule) — DST géré
# via `timezone`, comme flightdeals.config (voir zoneinfo). Les 2 services utilisent des cles
# SerpApi distinctes (SERPAPI_KEY vs SEARCH_SERPAPI_KEY) donc pas de contention de quota a
# tourner au meme instant.
schedule: "10:30"
timezone: "Europe/Oslo"

departure:
  center: "2027-01-15"
  tolerance_days: 2      # teste les 5 dates 13-17 janvier 2027, CHAQUE jour

duration:
  center_days: 35
  tolerance_days: 5      # 30 a 40 jours ; UNE seule valeur testee par jour, en rotation
                          # (voir tracker.py) pour tenir le cout sous le quota gratuit

# Demande de l'amie proprietaire du compte SerpApi : pas de vol en classe Economy, et pas
# plus d'une escale. travel_class est un selecteur EXACT cote SerpApi (verifie en direct :
# demander Premium Economy ne renvoie jamais de tarifs Affaires/Premiere, et inversement) —
# donc pas de "Economy+ ou mieux" en un seul appel. Fixe a Premium Economy (le moins cher des
# 3 classes acceptables) plutot que de tester les 3 en rotation, pour ne pas alourdir le cout
# (3 classes x 5 dates = ~450 requetes/mois, au-dessus du forfait gratuit 250/mois de l'amie).
filters:
  required_stops: 1       # escales EXACTES exigees (filtre cote client, gratuit)
  travel_class: 2          # 1=Economy 2=Premium Economy 3=Affaires 4=Premiere
