# Configuration du suivi Santiago. Destinations Lima/La Paz : pas automatisees pour
# l'instant (backup, via scripts/search_custom_route.py en manuel si besoin).

origin: OSL
destination: SCL
destination_name: Santiago
currency: NOK

# Meme heure que l'agregateur principal (config/config.yaml: collection.schedule) — DST géré
# via `timezone`, comme flightdeals.config (voir zoneinfo). Les 2 services utilisent des cles
# SerpApi distinctes (SERPAPI_KEY vs SEARCH_SERPAPI_KEY) donc pas de contention de quota a
# tourner au meme instant.
schedule: "10:30"
timezone: "Europe/Oslo"

departure:
  center: "2027-01-15"
  tolerance_days: 2      # teste les 5 dates 13-17 janvier 2027, CHAQUE jour

duration:
  center_days: 35
  tolerance_days: 5      # 30 a 40 jours ; UNE seule valeur testee par jour, en rotation
                          # (voir tracker.py) pour tenir le cout sous le quota gratuit
